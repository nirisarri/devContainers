[project]
name = "pysample"
version = "0.1.0"
description = "A sample FastAPI application with an in-memory items REST API"
readme = "README.md"
authors = [
    { name = "Nicolas De Irisarri", email = "nirisarri@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
pysample = "pysample:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "ASYNC", "PT", "TC", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
# Asserts are the point in tests, and TYPE_CHECKING blocks only obscure fixtures.
"tests/**" = ["S101", "ANN", "TC"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
